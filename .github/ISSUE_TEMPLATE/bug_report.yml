name: Something is broken
description: A screen, a playback problem, or anything the add-on gets wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The four version fields below are asked for
        first because almost every question we would come back with is one of
        them, and a report that carries them can usually be acted on straight
        away.

        **Please do not paste a whole Kodi log.** It contains stream URLs with
        access tokens in them, and this is a public repository. A few lines
        around the problem is what helps; see the last field.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Opened a show from Continue Watching and pressed Play.
        Expected it to resume; it started from the beginning instead.
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: Settings → Privacy & About, at the bottom of the page.
      placeholder: "0.9.3"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: tofa server version
      description: >
        Your server's own Settings page shows it. If you cannot reach the
        server, say so here instead — that is useful in itself.
      placeholder: "0.9.30"
    validations:
      required: true

  - type: input
    id: kodi-version
    attributes:
      label: Kodi version and device
      description: Settings → System Information in Kodi.
      placeholder: "Kodi 21.3 on CoreELEC, Amlogic box"
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - It happened once
        - I have not tried again
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant log lines (optional)
      description: >
        Lines from `kodi.log` around the moment it went wrong. **Redact
        anything that looks like a token** — in particular `st=`, `token=`
        and `Authorization:` values, which are credentials.
      render: text
    validations:
      required: false
